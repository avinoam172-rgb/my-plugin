<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugin Compiler</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏️</text></svg>">
<style>
:root{--bg:#0e1116;--card:#161b22;--line:#2a313c;--text:#e6e8eb;--muted:#8b93a1;--accent:#5bd66a;--err:#ff6b6b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(900px 500px at 50% -10%,#1c2a20,var(--bg));color:var(--text);display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 20px 50px #0008}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.logo{width:36px;height:36px;border-radius:9px;background:#1f2a22;display:grid;place-items:center;font-size:20px;border:1px solid #2b3d30}
h1{font-size:17px;margin:0;line-height:1.2}
header p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.drop{display:block;border:1.5px dashed var(--line);border-radius:12px;padding:20px 12px;text-align:center;cursor:pointer;transition:.15s;background:#12171d}
.drop:hover,.drop.over{border-color:var(--accent);background:#14201a}
.drop.has{border-style:solid;border-color:#2b3d30}
.drop svg{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.drop b{display:block;font-size:14px;margin-top:6px}
.drop small{display:block;color:var(--muted);font-size:12px;margin-top:2px;direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=file]{display:none}
button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:10px;background:var(--accent);color:#08210d;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
button:hover:not(:disabled){filter:brightness(1.08)}
button:disabled{background:#242b34;color:#5b6472;cursor:not-allowed}
.status{margin-top:12px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;min-height:18px}
.status.ok{color:var(--accent)}
.status.err{color:var(--err)}
.status a{color:var(--accent);margin-inline-start:auto;text-decoration:none;font-weight:600}
.spin{width:14px;height:14px;border:2px solid #34503a;border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
details{margin-top:8px;font-size:12px}
summary{cursor:pointer;color:var(--muted)}
pre{margin:6px 0 0;padding:10px;background:#0b0e13;border:1px solid var(--line);border-radius:8px;direction:ltr;text-align:left;white-space:pre-wrap;max-height:180px;overflow:auto;font-size:11px;color:#c5cad3}
</style>
</head>
<body>
<main class="card">
  <header>
    <div class="logo">⛏️</div>
    <div>
      <h1>מקמפל פלאגינים</h1>
      <p>ZIP של פרויקט Maven ← קובץ JAR</p>
    </div>
  </header>

  <label class="drop" id="drop">
    <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    <b id="title">גרור ZIP לכאן או לחץ לבחירה</b>
    <small id="fname">pom.xml · plugin.yml · src/</small>
    <input type="file" id="file" accept=".zip">
  </label>

  <button id="btn" disabled>קמפל</button>
  <div class="status" id="status"></div>
  <details id="det" hidden><summary>פרטי השגיאה</summary><pre id="log"></pre></details>
</main>

<script>
const $=id=>document.getElementById(id);
const drop=$('drop'),input=$('file'),btn=$('btn'),st=$('status'),det=$('det'),log=$('log');
let file=null,timer=null;

function show(type,text,spin){
  st.className='status '+type;st.textContent='';
  if(spin){const s=document.createElement('span');s.className='spin';st.append(s)}
  if(text)st.append(text);
}
function setFile(f){
  if(!f)return;
  if(!/\.zip$/i.test(f.name)){show('err','צריך קובץ ZIP');return}
  file=f;$('title').textContent='הקובץ נבחר';
  $('fname').textContent=f.name+' · '+Math.max(1,Math.round(f.size/1024))+' KB';
  drop.classList.add('has');btn.disabled=false;show('','');det.hidden=true;
}
input.onchange=()=>setFile(input.files[0]);
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',ev=>setFile(ev.dataTransfer.files[0]));

btn.onclick=async()=>{
  if(!file)return;
  btn.disabled=true;det.hidden=true;
  let t=0;show('','מקמפל… 0 שנ׳',true);
  timer=setInterval(()=>{t++;show('','מקמפל… '+t+' שנ׳',true)},1000);
  try{
    const fd=new FormData();fd.append('project',file);
    const res=await fetch('/build',{method:'POST',body:fd});
    if(res.ok){
      const m=(res.headers.get('Content-Disposition')||'').match(/filename="?([^";]+)"?/);
      const url=URL.createObjectURL(await res.blob());
      const name=m?m[1]:'plugin.jar';
      const a=document.createElement('a');a.href=url;a.download=name;a.click();
      show('ok','✓ הקימפול הצליח');
      const again=document.createElement('a');again.href=url;again.download=name;again.textContent='הורד שוב';
      st.append(again);
    }else{
      const d=await res.json();
      show('err',d.error||'שגיאה');
      if(d.log){log.textContent=d.log;det.hidden=false;det.open=true}
    }
  }catch(e){show('err','שגיאה: '+e.message)}
  clearInterval(timer);btn.disabled=false;
};
</script>
</body>
</html>
